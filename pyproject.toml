[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "change-aware-test-selector"
version = "0.1.0"
requires-python = ">=3.10"
description = "Conservative Git-based test selection with explicit mappings"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
change-tests = "selector.cli:main"

[tool.setuptools.packages.find]
include = ["selector*", "demo_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
