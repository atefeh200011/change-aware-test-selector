name: tests-and-selection
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Full-suite verification backstop
        run: python -m pytest -q
      - name: Selection against available event base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          BASE="${PR_BASE:-$PUSH_BASE}"
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="$(git rev-list --max-parents=0 HEAD | head -n 1)"
          fi
          python -m selector.cli --base "$BASE" --run
      - name: Controlled selection and fault demonstration
        run: python evaluation/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selection-reports
          path: reports/
